<style>
/* ═══════════════════════════════════════════════════════ TOKENS ═══ */
:root{
  --surface-0:#0c1015;
  --surface-1:#12171f;
  --surface-2:#181f29;
  --surface-3:#1f2836;
  --line:#26303d;
  --line-soft:#1c2531;

  --text-primary:#f2f5f8;
  --text-secondary:#a8b4c2;
  --text-muted:#6f7d8d;

  --accent:#4fd6a5;
  --accent-dim:#199e70;
  --accent-glow:rgba(79,214,165,.14);

  /* Paleta categórica validada para superficie oscura (CVD + contraste) */
  --c-blue:#3987e5;
  --c-orange:#d95926;
  --c-aqua:#199e70;

  --phase-tecnica:var(--c-blue);
  --phase-transicion:var(--c-orange);
  --phase-agil:var(--c-aqua);

  --radius:14px;
  --radius-sm:9px;
  --maxw:1120px;
  /* Rail de navegación de la izquierda (LineSidebar) */
  --rail-w:250px;      /* franja que el rail se reserva para él solo */
  --rail-inset:28px;   /* separación de la primera marca respecto del borde */
  --marker-len:34px;   /* largo de la raya que acompaña a cada sección */
  --marker-gap:12px;   /* aire entre la raya y el número */
  --rail-gap:22px;     /* separación vertical entre secciones */
  --rail-shift:14px;   /* cuánto se corre el texto cuando el mouse se acerca */
  --tick-scale:.5;     /* largo del tick intermedio, en partes de --marker-len */
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
}

/* ══════════════════════════════════════════════════════════ BASE ═══ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);background:var(--surface-0);color:var(--text-primary);
  line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ══════════════════════════════════════════════════ FONDO VIVO ═══
   El fondo es una AURORA en WebGL (shader de reactbits.dev, reescrito
   sin React ni la librería ogl para no romper el "archivo único").
   El canvas ocupa toda la ventana y la aurora se pinta en el tercio
   de arriba, que es donde el shader concentra la intensidad.

   Debajo quedan las cuatro nubes CSS originales como PLAN B: si el
   navegador no tiene WebGL2, el JS no enciende el canvas y se ven
   ellas. No las borres pensando que son código muerto.              */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:.55;   /* la aurora original es muy saturada para este fondo */
}
/* Con el canvas andando, las nubes se apagan: son excluyentes */
.bg.gl i{display:none}
/* Elipses, no círculos: al rotar, la silueta cambia y las nubes parecen
   deformarse. Donde dos se superponen nacen y mueren formas nuevas. */
.bg i{position:absolute;display:block;border-radius:50%;will-change:transform,opacity}
.bg i:nth-child(1){
  top:-38vh;left:-26vw;width:128vw;height:82vh;
  background:radial-gradient(closest-side,rgba(79,214,165,.22),rgba(79,214,165,.08) 52%,transparent 76%);
  animation:cloud-a 17s ease-in-out infinite alternate,
            breathe-a 11s ease-in-out infinite alternate;
}
.bg i:nth-child(2){
  top:-30vh;right:-30vw;width:120vw;height:76vh;
  background:radial-gradient(closest-side,rgba(57,135,229,.21),rgba(57,135,229,.07) 52%,transparent 76%);
  animation:cloud-b 23s ease-in-out infinite alternate,
            breathe-b 15s ease-in-out infinite alternate;
}
.bg i:nth-child(3){
  top:2vh;left:18vw;width:112vw;height:70vh;
  background:radial-gradient(closest-side,rgba(124,92,255,.18),rgba(124,92,255,.06) 52%,transparent 76%);
  animation:cloud-c 29s ease-in-out infinite alternate,
            breathe-a 13s ease-in-out infinite alternate;
}
.bg i:nth-child(4){
  bottom:-34vh;left:-20vw;width:118vw;height:74vh;
  background:radial-gradient(closest-side,rgba(45,196,190,.16),rgba(45,196,190,.05) 52%,transparent 76%);
  animation:cloud-d 19s ease-in-out infinite alternate,
            breathe-b 9s ease-in-out infinite alternate;
}
@keyframes cloud-a{
  0%  {transform:translate3d(0,0,0)        rotate(0deg)   scale(1)}
  100%{transform:translate3d(24vw,17vh,0)  rotate(58deg)  scale(1.28)}
}
@keyframes cloud-b{
  0%  {transform:translate3d(0,0,0)        rotate(0deg)   scale(1.12)}
  100%{transform:translate3d(-22vw,21vh,0) rotate(-66deg) scale(.82)}
}
@keyframes cloud-c{
  0%  {transform:translate3d(0,0,0)        rotate(0deg)   scale(.9)}
  100%{transform:translate3d(-28vw,-19vh,0) rotate(74deg) scale(1.32)}
}
@keyframes cloud-d{
  0%  {transform:translate3d(0,0,0)        rotate(0deg)   scale(1.05)}
  100%{transform:translate3d(26vw,-18vh,0) rotate(-50deg) scale(.86)}
}
/* La opacidad late en otro período, así las nubes se forman y se disuelven */
@keyframes breathe-a{0%{opacity:.55} 100%{opacity:1}}
@keyframes breathe-b{0%{opacity:1}   100%{opacity:.5}}
h1,h2,h3,h4{margin:0;line-height:1.18;font-weight:600;letter-spacing:-.021em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px;position:relative;z-index:1}

/* ═══════════════════════════════════════════════ SCROLL PROGRESS ═══ */
#progress{
  position:fixed;top:0;left:0;height:2px;width:0%;z-index:120;
  background:linear-gradient(90deg,var(--c-blue),var(--c-orange),var(--accent));
  transition:width .1s linear;
}

/* ══════════════════════════════════════════════════════ NAVBAR ═══ */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(12,16,21,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;transition:border-color .3s var(--ease),background .3s var(--ease);
}
header.scrolled{border-bottom-color:var(--line-soft);background:rgba(12,16,21,.9)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.02em;flex-shrink:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent-dim),var(--c-blue));
  color:#08110d;font-size:12.5px;font-weight:700;
}
.brand-name{font-size:14.5px}
.nav-links{display:flex;gap:2px;align-items:center}
.nav-links a{font-size:13px;color:var(--text-secondary);padding:7px 9px;border-radius:8px;transition:color .2s,background .2s;white-space:nowrap}
.nav-links a:hover{color:var(--text-primary);background:var(--surface-2)}
.nav-links a.active{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.lang-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2.5px}
.lang-switch button{font-size:12px;font-weight:600;padding:4.5px 11px;border-radius:6.5px;color:var(--text-muted);transition:.2s var(--ease);letter-spacing:.03em}
.lang-switch button[aria-pressed="true"]{background:var(--surface-3);color:var(--text-primary)}

/* ═══════════════════════════════ RAIL DE NAVEGACIÓN (LineSidebar) ═══
   Las cinco secciones como una escala vertical numerada, fija a la
   izquierda: una raya por sección, un tick corto entre medio y el
   texto que se enciende y se corre cuando el mouse se acerca.
   Adaptación del LineSidebar de reactbits.dev a HTML plano.

   Antes acá vivía el Option Wheel del mismo sitio. Se cambió: era un
   SELECTOR, no un menú. Con las cinco opciones en arco, rotadas y
   desenfocadas, se leía chico y decorativo. Este es un componente de
   navegación de verdad y no sacrifica legibilidad.

   El rail solo aparece cuando hay lugar (≥1180px). Por debajo, la
   navegación vuelve a los links horizontales de la barra, como antes. */
.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);z-index:95;
  display:none;align-items:center;
  outline:none;
}
.rail-list{
  position:relative;width:100%;
  padding-left:calc(var(--rail-inset) + var(--marker-len) + var(--marker-gap));
  display:flex;flex-direction:column;gap:var(--rail-gap);
}
.rail-item{position:relative}
.rail-link{display:block;position:relative}
/* Zona de click más generosa que el texto: incluye la raya de la izquierda */
.rail-link::before{content:'';position:absolute;inset:-7px -14px -7px -46px}
.rail-text{
  display:inline-flex;align-items:baseline;white-space:nowrap;
  font-size:15.4px;line-height:1.2;letter-spacing:-.012em;
  color:var(--text-muted);
  color:color-mix(in srgb,var(--accent) calc(var(--effect,0) * 100%),var(--text-muted));
  transform:translateX(calc(var(--effect,0) * var(--rail-shift)));
  will-change:transform,color;
}
.rail-item.is-active .rail-text{font-weight:600}
/* El número en monoespaciada: hace que las cinco entradas se lean como
   una lista ordenada y no como cinco links sueltos. */
.rail-index{
  font-family:var(--mono);margin-right:.58rem;font-size:.8em;
  opacity:calc(.5 + var(--effect,0) * .5);
}
.rail-marker{
  position:absolute;top:50%;left:calc(-1 * (var(--marker-len) + var(--marker-gap)));
  height:1px;width:var(--marker-len);
  background:var(--line);
  background:color-mix(in srgb,var(--accent) calc(var(--effect,0) * 100%),var(--line));
  transform-origin:left center;
  transform:translateY(-50%) scaleX(calc(.7 + var(--effect,0) * .5));
}
/* Tick corto entre sección y sección: es lo que hace que el conjunto se
   lea como una regla graduada y no como una lista con viñetas. */
.rail-item:not(:last-child)::after{
  content:'';position:absolute;
  top:calc(100% + var(--rail-gap) / 2);
  left:calc(-1 * (var(--marker-len) + var(--marker-gap)));
  height:1px;width:calc(var(--marker-len) * var(--tick-scale));
  background:var(--line);opacity:.5;
  transform-origin:left center;
  transform:translateY(-50%) scaleX(calc(.7 + var(--effect,0) * .6));
}

/* ════════════════════════════════════════════════════════ HERO ═══ */
.hero{padding:142px 0 46px}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:56px;align-items:start}
.hero-badges{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.avail{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
  padding:5px 13px 5px 11px;border-radius:20px;
  border:1px solid rgba(79,214,165,.3);background:rgba(79,214,165,.08);
}
.avail .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:relative;flex-shrink:0}
.avail .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent);opacity:.45;animation:pulse 2.4s var(--ease) infinite}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.55rem);letter-spacing:-.035em;margin-bottom:14px}
.hero h1 .light{font-weight:300}

/* ── Foco que barre el título de derecha a izquierda ──
   La luz se recorta contra los glifos (background-clip:text), así
   ilumina las letras y no el rectángulo del fondo. Cada mitad del
   nombre conserva su color base dentro del degradado.            */
.hero h1 .n1,.hero h1 .light{
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  background-repeat:no-repeat;background-size:300% 100%;
  animation:title-sweep 6.4s linear infinite;   /* 20% más rápido */
}
/* Las bases van un escalón por debajo del blanco puro: si el texto ya
   estuviera al máximo, el foco no tendría a dónde iluminar. */
/* El salto entre base y punta del haz es lo que se percibe como brillo.
   Como el blanco ya está al tope, el 15% extra sale de bajar la base. */
.hero h1 .n1{
  background-image:linear-gradient(100deg,
    #bbc6d3 42%, #ffffff 50%, #bbc6d3 58%);   /* haz angosto = se lee como foco */
  animation-delay:1.2s;
}
.hero h1 .light{
  background-image:linear-gradient(100deg,
    #74818f 42%, #f4f9fe 50%, #74818f 58%);
  animation-delay:1.08s;          /* llega apenas antes: la luz cruza sin cortarse */
}
/* background-position DEBE quedar entre 0% y 100%: fuera de ese rango el
   degradado sale del elemento y, como el texto es transparente, el nombre
   se vuelve invisible. Dentro del rango siempre hay color base pintado. */
@keyframes title-sweep{
  0%       {background-position:0% 0}     /* la luz todavía no entró (derecha) */
  32%,100% {background-position:100% 0}   /* la luz ya salió (izquierda) */
}
.hero-role{font-size:clamp(1.02rem,2vw,1.16rem);font-weight:500;color:var(--accent);margin-bottom:22px}
.hero-tagline{
  font-size:clamp(1.16rem,2.6vw,1.42rem);font-weight:300;color:var(--text-primary);
  line-height:1.42;letter-spacing:-.02em;max-width:19ch;
  padding-left:18px;border-left:2px solid var(--line);margin-bottom:26px;
}
.hero-summary{color:var(--text-secondary);font-size:15.4px;max-width:60ch;margin-bottom:32px}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 19px;border-radius:10px;font-size:14px;font-weight:500;transition:.22s var(--ease);border:1px solid transparent}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--accent);color:#062018;font-weight:600}
.btn-primary:hover{background:#6ee2b8;transform:translateY(-1.5px);box-shadow:0 8px 22px -8px var(--accent)}
.btn-ghost{border-color:var(--line);color:var(--text-secondary);background:var(--surface-1)}
.btn-ghost:hover{border-color:var(--text-muted);color:var(--text-primary);transform:translateY(-1.5px)}

.photo{
  width:186px;height:186px;border-radius:22px;flex-shrink:0;position:relative;
  background:linear-gradient(150deg,var(--surface-2),var(--surface-1));
  border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;
}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.photo-mono{font-size:44px;font-weight:600;letter-spacing:-.03em;color:var(--surface-3)}
.photo-hint{position:absolute;bottom:13px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}

/* ═══════════════════════════════════════════════════ KPI TILES ═══ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;margin-top:56px}
.kpi{background:var(--surface-1);padding:22px 22px 20px;transition:background .25s var(--ease)}
.kpi:hover{background:var(--surface-2)}
.kpi-value{font-size:2.15rem;font-weight:600;letter-spacing:-.04em;line-height:1;margin-bottom:9px}
.kpi-value .unit{font-size:1.02rem;font-weight:500;color:var(--text-muted);margin-left:3px}
.kpi-value.is-text{font-size:1.72rem;letter-spacing:-.02em}
.kpi-value.is-text .unit{font-size:1.72rem;font-weight:600;color:var(--accent);margin-left:6px}
.kpi-label{font-size:12.6px;color:var(--text-secondary);line-height:1.4}
.kpi-note{font-size:11.4px;color:var(--text-muted);margin-top:5px}

/* ══════════════════════════════════════════════ SPRINT BANNER ═══ */
.sprint{
  margin-top:18px;background:var(--surface-1);border:1px solid var(--line-soft);
  border-radius:var(--radius);overflow:hidden;position:relative;
}
.sprint::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--c-blue))}
.sprint-top{
  display:flex;align-items:center;gap:10px;padding:15px 24px;
  border-bottom:1px solid var(--line-soft);background:var(--surface-2);
}
.live{width:7px;height:7px;border-radius:50%;background:var(--accent);position:relative;flex-shrink:0}
.live::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent);opacity:.45;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.6}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.sprint-status{font-size:11.4px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sprint-id{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);letter-spacing:.02em}
.sprint-main{padding:24px}
.sprint-goal-label{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.sprint-goal{font-size:clamp(1.08rem,2.3vw,1.3rem);font-weight:400;letter-spacing:-.022em;line-height:1.45;color:var(--text-primary);max-width:46ch}
.sprint-facts{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;margin-bottom:-16px;border-top:1px solid var(--line-soft);padding-top:18px}
.fact{flex:1 1 150px;padding-right:20px;margin-bottom:16px}
.fact-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.fact-v{font-size:14.4px;font-weight:500;color:var(--text-primary)}

/* ════════════════════════════════════════════════════ SECTIONS ═══ */
section{padding:56px 0;position:relative;z-index:1}
.sec-head{margin-bottom:28px}
.sec-kicker{
  display:inline-flex;align-items:center;gap:8px;font-size:11.4px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:13px;
  padding:4px 11px 4px 9px;border:1px solid rgba(79,214,165,.28);border-radius:20px;
  background:rgba(79,214,165,.07);
}
.sec-kicker::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}
.sec-head h2{font-size:clamp(1.55rem,3.3vw,2.05rem);letter-spacing:-.03em;margin-bottom:11px}
.sec-head p{color:var(--text-secondary);font-size:14.8px;max-width:64ch}
.sec-head .ceremony{color:var(--text-muted);font-size:13.6px;font-style:italic;max-width:64ch;margin-top:9px;padding-left:13px;border-left:2px solid var(--line-soft)}

/* ══════════════════════════════════════════════════ CONTROLES ═══ */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line-soft)}
.view-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.view-switch button{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:500;padding:6.5px 14px;border-radius:7px;color:var(--text-muted);transition:.22s var(--ease)}
.view-switch button svg{width:14px;height:14px}
.view-switch button[aria-pressed="true"]{background:var(--surface-3);color:var(--text-primary)}

/* ══════════════════════════════════════════════════════ CARDS ═══ */
.card{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;transition:border-color .25s var(--ease),opacity .3s var(--ease);position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--phase-color);opacity:.85}
.card:hover{border-color:var(--line)}
.card.dimmed{opacity:.24;pointer-events:none}
.card-btn{width:100%;text-align:left;padding:20px 22px;display:block}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:5px}
.card-org{font-size:11.4px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--phase-color);margin-bottom:7px;display:block}
.card-role{font-size:15.6px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.card-meta{font-size:12.4px;color:var(--text-muted);margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card-meta .sep{opacity:.4}
#view-board .card-meta{flex-direction:column;align-items:flex-start;gap:2px}
#view-board .card-meta .sep{display:none}
.card-toggle{flex-shrink:0;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-muted);transition:.25s var(--ease)}
.card-toggle svg{width:13px;height:13px;transition:transform .3s var(--ease)}
.card.open .card-toggle{background:var(--surface-3);color:var(--text-primary)}
.card.open .card-toggle svg{transform:rotate(180deg)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.tag{font-size:11px;padding:3.5px 9px;border-radius:6px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--line-soft)}
.card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.card.open .card-body{grid-template-rows:1fr}
.card-body-inner{overflow:hidden}
.card-body-pad{padding:0 22px 22px;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:18px}
.metrics{display:flex;flex-wrap:wrap;gap:1px;background:var(--line-soft);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:18px}
.metric{background:var(--surface-2);padding:11px 15px;flex:1 1 130px}
.metric-value{font-size:1.32rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:var(--phase-color)}
.metric-label{font-size:11.6px;color:var(--text-muted);margin-top:3px}
.bullets li{position:relative;padding-left:19px;margin-bottom:11px;font-size:14.2px;color:var(--text-secondary);line-height:1.6}
.bullets li:last-child{margin-bottom:0}
.bullets li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:2px;background:var(--phase-color);opacity:.7}

/* ═══════════════════════════════════════════════════ TIMELINE ═══ */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(180deg,var(--c-aqua),var(--c-orange),var(--c-blue));opacity:.42}
.tl-item{position:relative;margin-bottom:20px}
.tl-item:last-child{margin-bottom:0}
.tl-node{position:absolute;left:-30px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--phase-color);border:2.5px solid var(--surface-0);box-shadow:0 0 0 2.5px var(--phase-color)}

/* ══════════════════════════════════════════════════════ BOARD ═══ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.col-swatch{width:9px;height:9px;border-radius:3px;background:var(--phase-color);flex-shrink:0}
.col-title{font-size:12.4px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.col-count{margin-left:auto;font-size:11px;color:var(--text-muted);background:var(--surface-2);padding:2px 8px;border-radius:20px;border:1px solid var(--line-soft)}
.col-years{font-size:11px;color:var(--text-muted)}
.col-cards{display:flex;flex-direction:column;gap:12px}
.col-empty{border:1.5px dashed var(--line-soft);border-radius:var(--radius);padding:22px;text-align:center;font-size:12.4px;color:var(--text-muted)}
#view-timeline,#view-board{display:none}
html[data-view="timeline"] #view-timeline{display:block}
html[data-view="board"] #view-board{display:block}

/* ══════════════════════════════════════════════════ TESTIMONIOS ═══ */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.quote{
  margin:0;background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:24px;position:relative;transition:border-color .25s var(--ease),transform .25s var(--ease);
  display:flex;flex-direction:column;
}
.quote blockquote{margin:0}
.quote-who{margin-top:auto}
.quote:hover{border-color:var(--line);transform:translateY(-2px)}
.quote-mark{font-size:44px;line-height:.6;color:var(--accent);opacity:.32;font-weight:700;display:block;margin-bottom:8px}
.quote-text{font-size:14.6px;color:var(--text-secondary);line-height:1.62;margin-bottom:18px}
.quote-who{display:flex;align-items:center;gap:11px;padding-top:15px;border-top:1px solid var(--line-soft)}
.quote-av{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:var(--surface-3);color:var(--text-secondary);font-size:12.5px;font-weight:600;
}
.quote-name{font-size:13.6px;font-weight:600;color:var(--text-primary);line-height:1.3}
.quote-role{font-size:12px;color:var(--text-muted);margin-top:1px}

/* ══════════════════════════════════════════════════════ RETRO ═══ */
/* El contenedor es la pizarra: superficie con grilla de puntos */
.retro{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start;
  padding:26px 24px 30px;border-radius:var(--radius);
  border:1px solid var(--line-soft);background-color:var(--surface-1);
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);
  background-size:24px 24px;background-position:12px 12px;
}
.retro-col{--rc:var(--c-aqua)}
.retro-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--line-soft)}
.retro-icon{
  width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rc);
  border:1px solid color-mix(in srgb,var(--rc) 34%,transparent);
}
.retro-icon svg{width:14px;height:14px}
.retro-title{font-size:13.4px;font-weight:600;letter-spacing:-.01em;color:var(--text-primary);line-height:1.3}
.retro-sub{font-size:11px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.retro-notes{display:flex;flex-direction:column;gap:20px}

/* ── Post-it colgado de una chinche ── */
.note{
  --rot:0deg;
  position:relative;margin-top:9px;padding:19px 17px 16px;
  border-radius:3px;                                   /* papel, no tarjeta */
  background:color-mix(in srgb,var(--rc) 15%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--rc) 32%,transparent);
  box-shadow:0 8px 18px -8px rgba(0,0,0,.75);
  transform:rotate(var(--rot));
  transform-origin:50% 0;                              /* pivota en la chinche */
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  cursor:pointer;
}
/* La chinche */
.note::before{
  content:'';position:absolute;top:-7px;left:50%;margin-left:-6px;
  width:12px;height:12px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 34% 30%,#fff 0 14%,var(--rc) 46%,color-mix(in srgb,var(--rc) 55%,#000) 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.65);
}
.note:hover{
  transform:rotate(var(--rot)) translateY(-3px);
  box-shadow:0 15px 28px -10px rgba(0,0,0,.85);
}
@keyframes pin-swing{
  0%  {transform:rotate(var(--rot))}
  18% {transform:rotate(calc(var(--rot) + 7deg))}
  38% {transform:rotate(calc(var(--rot) - 5deg))}
  56% {transform:rotate(calc(var(--rot) + 3.2deg))}
  74% {transform:rotate(calc(var(--rot) - 1.8deg))}
  88% {transform:rotate(calc(var(--rot) + .8deg))}
  100%{transform:rotate(var(--rot))}
}
.note.swing{animation:pin-swing .95s var(--ease)}
.note-lead{font-size:14.2px;font-weight:600;letter-spacing:-.015em;color:var(--text-primary);margin-bottom:6px;line-height:1.4}
.note-text{font-size:13.4px;color:var(--text-secondary);line-height:1.58}

/* ══════════════════════════════════════ DEFINITION OF DONE ═══ */
.dod{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:8px 0;display:grid;grid-template-columns:repeat(2,1fr)}
.dod-item{display:flex;gap:13px;align-items:flex-start;padding:16px 24px;transition:background .22s var(--ease)}
.dod-item:hover{background:var(--surface-2)}
.dod-check{
  width:20px;height:20px;border-radius:6px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;
  background:rgba(79,214,165,.13);border:1px solid rgba(79,214,165,.34);color:var(--accent);
}
.dod-check svg{width:12px;height:12px}
.dod-text{font-size:14.2px;color:var(--text-secondary);line-height:1.55}
.dod-text b{color:var(--text-primary);font-weight:600}

/* ═══════════════════════════════ COMPETENCIAS VERIFICADAS ═══ */
.verified{
  margin-bottom:16px;padding:20px 22px;border-radius:var(--radius);
  border:1px solid rgba(79,214,165,.24);background:rgba(79,214,165,.05);
}
.verified-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.verified-title{display:flex;align-items:center;gap:8px;font-size:12.6px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.verified-title svg{width:14px;height:14px}
.verified-note{font-size:12.4px;color:var(--text-muted)}
.verified-note a{color:var(--text-secondary);border-bottom:1px solid var(--line);transition:color .2s,border-color .2s}
.verified-note a:hover{color:var(--accent);border-color:var(--accent)}
.verified-list{display:flex;flex-wrap:wrap;gap:8px}
.vskill{
  display:inline-flex;align-items:center;gap:7px;font-size:13.2px;font-weight:500;
  padding:7px 13px 7px 11px;border-radius:8px;color:var(--text-primary);
  background:var(--surface-2);border:1px solid rgba(79,214,165,.26);
}
.vskill svg{width:13px;height:13px;color:var(--accent);flex-shrink:0}

/* ═════════════════════════════════════════════════ EDUCATION ═══ */
.edu-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.edu{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px}
.edu-status{font-size:10.6px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3.5px 9px;border-radius:6px;display:inline-block;margin-bottom:13px}
.edu-status.done{background:rgba(25,158,112,.14);color:var(--accent);border:1px solid rgba(25,158,112,.3)}
.edu-status.wip{background:rgba(217,89,38,.13);color:#f0885c;border:1px solid rgba(217,89,38,.3)}
.edu-status.cert{background:rgba(57,135,229,.13);color:#6fa9ee;border:1px solid rgba(57,135,229,.3)}
.edu h3{font-size:15.2px;margin-bottom:7px;line-height:1.35}
.edu p{font-size:13.2px;color:var(--text-muted)}

/* ══════════════════════════════════════════════ CERTIFICACIONES ═══ */
.certs{margin-top:16px;background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px 24px}
.certs-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.certs-title{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
.certs-link{font-size:12.6px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;transition:color .2s}
.certs-link:hover{color:var(--accent)}
.certs-link svg{width:12px;height:12px}
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cert-item{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);
  padding:13px 15px;display:flex;align-items:flex-start;gap:11px;transition:border-color .2s var(--ease);
}
.cert-item:hover{border-color:var(--accent-dim);transform:translateY(-1px)}
.cert-item.is-static{cursor:default}
.cert-item.is-static:hover{border-color:var(--line-soft);transform:none}
.verified{margin-top:16px}
.cert-item .cert-n{transition:color .2s var(--ease)}
.cert-item:hover .cert-n{color:var(--accent)}
.cert-out{
  width:12px;height:12px;flex-shrink:0;margin-left:auto;margin-top:2px;
  color:var(--text-muted);opacity:0;transition:opacity .2s var(--ease),color .2s var(--ease);
}
.cert-item:hover .cert-out,.edu.is-link:hover .cert-out{opacity:1;color:var(--accent)}
.edu.is-link{display:block;position:relative}
.edu.is-link:hover{border-color:var(--accent-dim)}
.edu.is-link h3{transition:color .2s var(--ease)}
.edu.is-link:hover h3{color:var(--accent)}
.edu.is-link .cert-out{position:absolute;top:22px;right:22px;margin:0;width:13px;height:13px}
.cert-ico{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--accent-dim)}
.cert-n{font-size:13.2px;font-weight:500;color:var(--text-primary);line-height:1.35}
.cert-o{font-size:11.6px;color:var(--text-muted);margin-top:3px}

/* ══════════════════════════════════════════════════════ DAILY ═══ */
.daily{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
.daily-item{background:var(--surface-1);padding:24px;transition:background .22s var(--ease)}
.daily-item:hover{background:var(--surface-2)}
.daily-q{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.daily-q svg{width:14px;height:14px;flex-shrink:0}
.daily-a{font-size:14.2px;color:var(--text-secondary);line-height:1.6}
.daily-a b{color:var(--text-primary);font-weight:600}

/* ═══════════════════════════════════════════════════ CONTACT ═══ */
.contact-box{background:linear-gradient(150deg,var(--surface-2),var(--surface-1));border:1px solid var(--line);border-radius:20px;padding:46px 40px;text-align:center;margin-top:22px}
.contact-box h2{font-size:clamp(1.5rem,3.3vw,2rem);margin-bottom:13px;letter-spacing:-.03em}
.contact-box > p{color:var(--text-secondary);font-size:15px;max-width:52ch;margin:0 auto 30px}
.contact-links{display:flex;flex-wrap:wrap;gap:11px;justify-content:center}
.contact-detail{display:flex;flex-wrap:wrap;gap:9px 26px;justify-content:center;margin-top:30px;padding-top:26px;border-top:1px solid var(--line-soft);font-size:13.2px;color:var(--text-muted)}
.contact-detail span{display:flex;align-items:center;gap:7px}
.contact-detail svg{width:14px;height:14px;opacity:.6}
footer{padding:34px 0 44px;border-top:1px solid var(--line-soft);margin-top:20px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:12.6px;color:var(--text-muted)}

/* ══════════════════════════════════════════════════════ REVEAL ═══ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
  .note{--rot:0deg}
  .note:hover{transform:none}
  .bg i{animation:none}
  /* Sin foco: el título vuelve a color sólido, no a medio degradado */
  .hero h1 .n1,.hero h1 .light{
    background-image:none;-webkit-text-fill-color:currentColor;color:var(--text-primary);
  }
  .hero h1 .light{color:var(--text-secondary)}
}

/* ══════════════════════════════════════════════════ RESPONSIVE ═══ */
/* El rail necesita su propia franja: si se superpusiera al contenido
   habría que elegir entre leer y navegar. Desde 1180px el cuerpo se
   corre a la derecha y el rail ocupa lo que dejó libre. Por debajo el
   rail no existe y manda la barra de arriba, igual que antes.

   OJO con el header: va con left:0 y padding-left, NO con left:var(--rail-w).
   Con left, la barra empezaba recién a los 250px y el vidrio esmerilado
   dejaba un hueco a la izquierda. Con padding, el fondo cruza toda la
   pantalla y el contenido igual queda alineado con el del cuerpo.     */
@media (min-width:1180px){
  body{padding-left:var(--rail-w)}
  header{left:0;padding-left:var(--rail-w)}
  .rail{display:flex}
  .nav-links{display:none}   /* el rail es el menú; dos menús sobran */
}
@media (max-width:960px){
  /* El tablero y la retro NO se apilan: conservan sus columnas y se
     deslizan al costado, como Trello o Miro en el celular. El 82%
     de ancho deja asomar la columna siguiente para que se note. */
  .board,.retro{
    display:flex;
    overflow-x:auto;overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;
    gap:14px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .board>*,.retro>*{flex:0 0 min(82%,300px);scroll-snap-align:start}
  .board{padding-bottom:6px}
  .retro{padding:20px 0 24px 18px;gap:16px}
  .retro>*:last-child{margin-right:18px}   /* padding derecho que el overflow se come */
  .board::-webkit-scrollbar,.retro::-webkit-scrollbar{height:6px}
  .board::-webkit-scrollbar-thumb,.retro::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .daily{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .edu-list,.dod{grid-template-columns:1fr}
  .nav-links{display:none}
}
@media (max-width:760px){
  .hero{padding:116px 0 36px}
  .hero-grid{grid-template-columns:1fr;gap:32px}
  .photo{width:124px;height:124px;order:-1}
  .photo-mono{font-size:32px}
  .photo-hint{display:none}
  .hero-tagline{max-width:none}
  .card-meta{flex-direction:column;align-items:flex-start;gap:2px}
  .card-meta .sep{display:none}
  .controls{flex-direction:column;align-items:stretch}
  .view-switch{width:100%}
  .view-switch button{flex:1;justify-content:center}
  section{padding:44px 0}
  .contact-box{padding:34px 22px}
  .sprint-main{padding:20px}
  .wrap{padding:0 18px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:1fr}
  .brand-name{display:none}
}

/* ═══════════════════════════════════════════════════════ PRINT ═══ */
@media print{
  body{background:#fff;color:#000}
  body{padding-left:0!important}
  body::before,header,#progress,.bg,.rail,.controls,.photo-hint,.card-toggle,footer,.hero-cta,.sprint-top{display:none!important}
  html[data-view] #view-board{display:none!important}
  html[data-view] #view-timeline{display:block!important}
  .card-body{grid-template-rows:1fr!important}
  .card,.kpi,.edu,.contact-box,.note,.dod,.daily-item,.sprint,.quote,.certs,.cert-item,.verified,.vskill{border:1px solid #ccc;background:#fff}
  .hero{padding:0}
  section{padding:18px 0;break-inside:avoid}
  .card,.note,.retro-col{break-inside:avoid}
  h1,h2,h3,.card-role,.kpi-value,.note-lead,.sprint-goal{color:#000}
  p,li,.card-meta,.kpi-label,.note-text,.dod-text,.daily-a{color:#333}
}
</style>
</head>

<body>
<div id="progress"></div>

  document.getElementById('quotes').innerHTML = list.map(q => {
    const initials = (q.name || '?').split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
    return `<figure class="quote">
      <span class="quote-mark" aria-hidden="true">&ldquo;</span>
      <blockquote class="quote-text">${L(q)}</blockquote>

          <div class="quote-role">${lang==='es'?q.roleEs:q.roleEn}</div>

function cardHTML(job, idx){
  const j = job[lang];
  const phase = DATA.phases.find(p => p.id === job.phase);
  const isOpen = openState.has(idx);
  const dimmed = (filter !== 'all' && !job.tags.includes(filter)) ? ' dimmed' : '';
  const metrics = job.metrics && job.metrics.length ? `
    <div class="metrics">${job.metrics.map(m => `
      <div class="metric"><div class="metric-value">${m.value}</div><div class="metric-label">${L(m)}</div></div>`).join('')}
    </div>` : '';
  return `
  <article class="card${isOpen?' open':''}${dimmed}" style="--phase-color:${phase.color}" data-idx="${idx}">
    <button class="card-btn" aria-expanded="${isOpen}" aria-controls="body-${idx}">
      <div class="card-top">
        <div>
          <span class="card-org">${typeof job.org === 'string' ? job.org : L(job.org)}</span>
          <h3 class="card-role">${j.role}</h3>
          <div class="card-meta">
            <span>${j.period}</span><span class="sep">·</span><span>${j.place}</span>
            ${j.current?`<span class="sep">·</span><span style="color:var(--accent)">● ${j.current}</span>`:''}
          </div>
        </div>
        <span class="card-toggle" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </div>
      <div class="card-tags">${job.tags.map(tg => `<span class="tag">${L(DATA.tags[tg])}</span>`).join('')}</div>
    </button>
    <div class="card-body" id="body-${idx}">
      <div class="card-body-inner"><div class="card-body-pad">
        ${metrics}
        <ul class="bullets">${job.bullets[lang].map(b => `<li>${b}</li>`).join('')}</ul>
      </div></div>
    </div>
  </article>`;
}

function renderTimeline(){
  document.getElementById('timeline').innerHTML = DATA.jobs.map((job, i) => {
    const phase = DATA.phases.find(p => p.id === job.phase);
    return `<div class="tl-item" style="--phase-color:${phase.color}"><span class="tl-node"></span>${cardHTML(job,i)}</div>`;
  }).join('');
}

function renderBoard(){
  document.getElementById('board').innerHTML = DATA.phases.map(p => {
    const jobs = DATA.jobs.map((j,i) => ({j,i})).filter(x => x.j.phase === p.id).reverse();
    const visible = jobs.filter(x => filter === 'all' || x.j.tags.includes(filter)).length;
    return `<div class="col" style="--phase-color:${p.color}">
      <div class="col-head">
        <span class="col-swatch"></span>
        <div><div class="col-title">${L(p)}</div><div class="col-years">${p.years}</div></div>
        <span class="col-count">${jobs.length}</span>
      </div>
      <div class="col-cards">
        ${jobs.map(x => cardHTML(x.j, x.i)).join('')}
        ${visible === 0 ? `<div class="col-empty">${t('review.noItems')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderRetro(){
  document.getElementById('retroBoard').innerHTML = DATA.retro.map((col, ci) => {
    const h = L(col);
    return `<div class="retro-col reveal" style="--rc:${col.color};--d:${ci*90}ms">
      <div class="retro-head">
        <span class="retro-icon">${ICONS[col.icon]}</span>
        <div><div class="retro-title">${h.title}</div><div class="retro-sub">${col.notes.length} ${lang==='es'?'notas':'notes'}</div></div>
      </div>
      <div class="retro-notes">
        ${col.notes.map((n, i) => { const x = L(n);
          // Rotaciones fijas para que el tablero se vea puesto a mano, no al azar
          const rot = [-1.6, 1.2, -0.7, 1.7, -1.1][(ci * 2 + i) % 5];
          return `<div class="note" style="--rot:${rot}deg"><div class="note-lead">${x.lead}</div><div class="note-text">${x.text}</div></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function applyStatic(){

function renderAll(){

/* ══════════════════════════════════════════════════════ AURORA ═══
   Fondo animado en WebGL2. El shader es el de Aurora de reactbits.dev,
   copiado tal cual; lo que se reescribió es el envoltorio, que allá es
   un componente de React sobre la librería ogl. Acá es WebGL a mano
   para no meter dependencias ni build en un archivo que se abre con
   doble click.

   Si algo falla —no hay WebGL2, el contexto no compila— la función
   se va sin tocar nada y quedan las nubes CSS. Nunca pantalla negra.

   Para retocarlo: AURORA_CFG. Los colores salen de la paleta del
   sitio, no de los violetas del demo original.                       */
const AURORA_CFG = {
  colorStops: ['#3987e5', '#4fd6a5', '#7c5cff'],  // azul → acento → violeta
  amplitude: 1.0,    // cuánto ondula la cortina
  blend: 0.5,        // qué tan difuso es el borde de abajo
  speed: 0.8,        // 1.0 es la velocidad del demo; acá va más calmo
  maxDpr: 1.5        // techo de resolución: arriba de esto no se nota y cuesta
};

(function initAurora(){
  const canvas = document.getElementById('aurora');
  const bg = document.querySelector('.bg');
  if (!canvas || !bg) return;

  const gl = canvas.getContext('webgl2', {
    alpha:true, premultipliedAlpha:true, antialias:true
  });
  if (!gl) return;   // sin WebGL2 mandan las nubes

  // String.raw para que sobrevivan las barras invertidas de COLOR_RAMP:
  // en un template normal, "\" + salto de línea se come el salto.
  const VERT = String.raw`#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

  const FRAG = String.raw`#version 300 es
precision highp float;

uniform float uTime;
uniform float uAmplitude;
uniform vec3 uColorStops[3];
uniform vec2 uResolution;
uniform float uBlend;

out vec4 fragColor;

vec3 permute(vec3 x) {
  return mod(((x * 34.0) + 1.0) * x, 289.0);
}

float snoise(vec2 v){
  const vec4 C = vec4(
      0.211324865405187, 0.366025403784439,
      -0.577350269189626, 0.024390243902439
  );
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);

  vec3 p = permute(
      permute(i.y + vec3(0.0, i1.y, 1.0))
    + i.x + vec3(0.0, i1.x, 1.0)
  );

  vec3 m = max(
      0.5 - vec3(
          dot(x0, x0),
          dot(x12.xy, x12.xy),
          dot(x12.zw, x12.zw)
      ),
      0.0
  );
  m = m * m;
  m = m * m;

  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);

  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

struct ColorStop {
  vec3 color;
  float position;
};

#define COLOR_RAMP(colors, factor, finalColor) {              \
  int index = 0;                                            \
  for (int i = 0; i < 2; i++) {                               \
     ColorStop currentColor = colors[i];                    \
     bool isInBetween = currentColor.position <= factor;    \
     index = int(mix(float(index), float(i), float(isInBetween))); \
  }                                                         \
  ColorStop currentColor = colors[index];                   \
  ColorStop nextColor = colors[index + 1];                  \
  float range = nextColor.position - currentColor.position; \
  float lerpFactor = (factor - currentColor.position) / range; \
  finalColor = mix(currentColor.color, nextColor.color, lerpFactor); \
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;

  ColorStop colors[3];
  colors[0] = ColorStop(uColorStops[0], 0.0);
  colors[1] = ColorStop(uColorStops[1], 0.5);
  colors[2] = ColorStop(uColorStops[2], 1.0);

  vec3 rampColor;
  COLOR_RAMP(colors, uv.x, rampColor);

  float height = snoise(vec2(uv.x * 2.0 + uTime * 0.1, uTime * 0.25)) * 0.5 * uAmplitude;
  height = exp(height);
  height = (uv.y * 2.0 - height + 0.2);
  float intensity = 0.6 * height;

  float midPoint = 0.20;
  float auroraAlpha = smoothstep(midPoint - uBlend * 0.5, midPoint + uBlend * 0.5, intensity);

  vec3 auroraColor = intensity * rampColor;

  fragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
}
`;

  function compile(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      console.warn('Aurora: shader no compiló —', gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }

  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.warn('Aurora: el programa no linkeó —', gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  // Un solo triángulo que se pasa de la pantalla: cubre todo el viewport
  // con la mitad de fragmentos de borde que dos triángulos.
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = {
    time:  gl.getUniformLocation(prog, 'uTime'),
    amp:   gl.getUniformLocation(prog, 'uAmplitude'),
    stops: gl.getUniformLocation(prog, 'uColorStops'),
    res:   gl.getUniformLocation(prog, 'uResolution'),
    blend: gl.getUniformLocation(prog, 'uBlend')
  };

  const hexToRgb = hex => {
    const h = hex.replace('#','');
    return [
      parseInt(h.slice(0,2),16)/255,
      parseInt(h.slice(2,4),16)/255,
      parseInt(h.slice(4,6),16)/255
    ];
  };
  gl.uniform3fv(U.stops, new Float32Array(AURORA_CFG.colorStops.flatMap(hexToRgb)));
  gl.uniform1f(U.amp, AURORA_CFG.amplitude);
  gl.uniform1f(U.blend, AURORA_CFG.blend);

  gl.clearColor(0,0,0,0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, AURORA_CFG.maxDpr);
    const w = Math.max(1, Math.round(canvas.clientWidth  * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    // gl_FragCoord viene en píxeles del buffer, así que uResolution
    // tiene que ser el buffer y no el tamaño CSS. Si no, el ruido
    // cambia de escala según la densidad de la pantalla.
    gl.uniform2f(U.res, w, h);
  }

  function draw(seconds){
    gl.uniform1f(U.time, seconds);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  bg.classList.add('gl');   // apaga las nubes CSS
  resize();
  window.addEventListener('resize', resize, { passive:true });

  const quieto = window.matchMedia('(prefers-reduced-motion: reduce)');

  let raf = 0;
  const loop = now => { raf = requestAnimationFrame(loop); resize(); draw(now * 0.001 * AURORA_CFG.speed); };

  function arrancar(){
    if (quieto.matches){
      // Movimiento reducido: un solo cuadro y listo. Una aurora quieta
      // se lee como una decisión; unas nubes congeladas, como un bug.
      cancelAnimationFrame(raf); raf = 0;
      resize(); draw(0);
      return;
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function frenar(){ cancelAnimationFrame(raf); raf = 0; }

  // En una pestaña de fondo no hay nada que mirar: no gastes batería.
  document.addEventListener('visibilitychange', () => document.hidden ? frenar() : arrancar());
  quieto.addEventListener('change', arrancar);
  arrancar();
})();

/* ══════════════════════════════════════════════ INTERACCIONES ═══ */
document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.lang;
    document.querySelectorAll('.lang-switch button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.lang === lang)));
    renderAll();
  });
});

document.querySelectorAll('.view-switch button').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.view;
    document.documentElement.dataset.view = v;
    document.querySelectorAll('.view-switch button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === v)));
  });
});

document.addEventListener('click', e => {
  const btn = e.target.closest('.card-btn'); if (!btn) return;
  const card = btn.closest('.card');
  const idx = Number(card.dataset.idx);
  const willOpen = !card.classList.contains('open');
  willOpen ? openState.add(idx) : openState.delete(idx);
  document.querySelectorAll(`.card[data-idx="${idx}"]`).forEach(c => {
    c.classList.toggle('open', willOpen);
    c.querySelector('.card-btn').setAttribute('aria-expanded', String(willOpen));
  });
});

/* Click en un post-it: se balancea colgando de la chinche */
document.addEventListener('click', e => {
  const note = e.target.closest('.note'); if (!note) return;
  note.classList.remove('swing');
  void note.offsetWidth;                       // reinicia la animación si ya estaba corriendo
  note.classList.add('swing');
});
document.addEventListener('animationend', e => {
  if (e.animationName === 'pin-swing') e.target.classList.remove('swing');
});

let io;
function observeReveals(){
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold:.06, rootMargin:'0px 0px -40px 0px' });
  document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
}

const header = document.getElementById('site-header');
const bar = document.getElementById('progress');
const navA = [...document.querySelectorAll('#navlinks a')];
const secs = navA.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);

/* ═══════════════════════════════ RAIL DE NAVEGACIÓN (LineSidebar) ═══
   Adaptación del LineSidebar de reactbits.dev. Cada sección tiene un
   número, una raya y una etiqueta; el conjunto se lee como una escala.

   El efecto es de CERCANÍA: cada ítem lleva una variable CSS --effect
   entre 0 y 1 que el mouse empuja hacia arriba según lo cerca que
   pase. El CSS hace el resto —color, corrimiento, largo de la raya—
   así que el JS solo mueve un número por ítem.

   El ítem de la sección en la que estás queda fijo en 1, aunque el
   mouse esté lejos: además de menú, el rail dice dónde estás parado.

   Antes acá vivía el Option Wheel del mismo sitio. Se cambió porque
   era un selector, no un menú: cinco opciones en arco, rotadas y
   desenfocadas, se leían chicas y decorativas.                       */
const RAIL = {
  radius: 120,       // px de alcance del efecto de cercanía
  smoothing: 100,    // constante de tiempo del suavizado, en ms
  falloff: 'smooth'  // 'linear' | 'smooth' | 'sharp'
};

/* Curvas de caída, las tres del original. 't' llega en 0..1, donde 1
   es "el mouse está justo encima". */
const RAIL_FALLOFF = {
  linear: t => t,
  smooth: t => t * t * (3 - 2 * t),   // smoothstep: arranca y termina suave
  sharp:  t => t * t * t              // solo se enciende muy cerca
};

const rail = document.getElementById('rail');
const railList = document.getElementById('railList');
const railItems = [];

if (rail && railList && secs.length === navA.length){
  navA.forEach((a, i) => {
    const li = document.createElement('li');
    li.className = 'rail-item';
    li.innerHTML =
      `<a class="rail-link" href="${a.getAttribute('href')}">` +
        `<span class="rail-marker" aria-hidden="true"></span>` +
        `<span class="rail-text">` +
          `<span class="rail-index" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>` +
          `<span class="rail-label" data-i18n="${a.dataset.i18n}"></span>` +
        `</span>` +
      `</a>`;
    railList.appendChild(li);
    railItems.push(li);
  });
}

const railQuieto = window.matchMedia('(prefers-reduced-motion: reduce)');
let railActive = 0;
let railTargets = railItems.map(() => 0);
let railCurrent = railItems.map(() => 0);
let railRaf = 0, railLast = 0;

function railPaint(){
  railItems.forEach((el, i) => {
    el.style.setProperty('--effect', railCurrent[i].toFixed(4));
    el.classList.toggle('is-active', i === railActive);
    const link = el.querySelector('.rail-link');
    if (i === railActive) link.setAttribute('aria-current', 'true');
    else link.removeAttribute('aria-current');
  });
}

/* Suavizado exponencial: independiente de los fps, a diferencia de
   sumar una fracción fija por cuadro. */
function railFrame(now){
  const dt = Math.min((now - railLast) / 1000, .05);
  railLast = now;
  const k = 1 - Math.exp(-dt / (Math.max(RAIL.smoothing, 1) / 1000));
  let quieto = true;
  for (let i = 0; i < railCurrent.length; i++){
    const d = railTargets[i] - railCurrent[i];
    if (Math.abs(d) < .001){ railCurrent[i] = railTargets[i]; continue; }
    railCurrent[i] += d * k;
    quieto = false;
  }
  railPaint();
  railRaf = quieto ? 0 : requestAnimationFrame(railFrame);
}

function railAnimar(){
  if (railQuieto.matches){ railCurrent = railTargets.slice(); railPaint(); return; }
  if (!railRaf){ railLast = performance.now(); railRaf = requestAnimationFrame(railFrame); }
}

/* El objetivo de cada ítem es lo más alto entre su cercanía al mouse y
   estar activo. Así el activo nunca se apaga al pasar el mouse por otro. */
let railPointerY = null;   // última posición del mouse, null si está afuera

function railApuntar(pointerY = railPointerY){
  railPointerY = pointerY;
  const curva = RAIL_FALLOFF[RAIL.falloff] || RAIL_FALLOFF.smooth;
  railItems.forEach((el, i) => {
    let prox = 0;
    if (pointerY !== null){
      const r = el.getBoundingClientRect();
      // Distancia vertical al centro del renglón: la lista es vertical,
      // medir también en horizontal solo agregaría ruido.
      const dist = Math.abs(pointerY - (r.top + r.height / 2));
      if (dist < RAIL.radius) prox = curva(1 - dist / RAIL.radius);
    }
    railTargets[i] = Math.max(prox, i === railActive ? 1 : 0);
  });
  railAnimar();
}

function railGoto(i){
  const s = secs[i];
  if (!s) return;
  s.scrollIntoView({ behavior: railQuieto.matches ? 'auto' : 'smooth', block:'start' });
}

if (railItems.length){
  railActive = 0;
  railApuntar(null);
  railCurrent = railTargets.slice();
  railPaint();

  railItems.forEach((el, i) => {
    el.querySelector('.rail-link').addEventListener('click', e => {
      e.preventDefault();   // scrollIntoView respeta el scroll-padding-top
      railActive = i; railApuntar(null); railGoto(i);
    });
  });

  rail.addEventListener('pointermove', e => railApuntar(e.clientY));
  rail.addEventListener('pointerleave', () => railApuntar(null));
  railQuieto.addEventListener('change', () => railApuntar(null));
}


function onScroll(){
  const y = window.scrollY;
  header.classList.toggle('scrolled', y > 12);
  const h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
  let cur = -1;
  secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= 140) cur = i; });
  navA.forEach((a, i) => a.classList.toggle('active', i === cur));
  // El rail marca la sección en la que estás. No hace falta candado como
  // con el wheel: acá el scroll solo cambia cuál está activo, no pelea
  // con ninguna animación de arrastre.
  if (railItems.length){
    const act = Math.max(0, cur);
    // Sin argumento: conserva dónde está el mouse, así scrollear con el
    // puntero sobre el rail no apaga el realce de cercanía.
    if (act !== railActive){ railActive = act; railApuntar(); }
  }
}
window.addEventListener('scroll', onScroll, { passive:true });

document.getElementById('year').textContent = new Date().getFullYear();
renderAll();
onScroll();
</script>
